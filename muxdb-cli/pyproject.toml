[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxdb-cli"
version = "0.1.0"
description = "CLI tool for MuxDB database orchestration plane"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
muxdb = "muxdb_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["muxdb_cli"]
